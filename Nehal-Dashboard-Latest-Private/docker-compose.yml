services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashboard}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U dashboard"], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 5s, retries: 10}
  backend:
    build: ./backend
    env_file: .env
    environment: {DATABASE_URL: postgresql+psycopg://dashboard:${POSTGRES_PASSWORD:-dashboard}@postgres:5432/dashboard, REDIS_URL: redis://redis:6379/0}
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  worker:
    build: ./backend
    command: celery -A app.workers.celery_app.celery worker -B --loglevel=info
    env_file: .env
    environment: {DATABASE_URL: postgresql+psycopg://dashboard:${POSTGRES_PASSWORD:-dashboard}@postgres:5432/dashboard, REDIS_URL: redis://redis:6379/0}
    depends_on: [backend]
  frontend:
    build: {context: ./frontend, args: {NEXT_PUBLIC_API_URL: http://localhost:8000/api}}
    ports: ["3000:3000"]
    depends_on: [backend]
volumes: {postgres_data: {}}
